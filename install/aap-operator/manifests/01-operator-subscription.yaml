---
# 01-operator-subscription.yaml
# Installs the Ansible Automation Platform Operator from the redhat-operators
# catalog into a dedicated namespace. Channel stable-2.6 brings the unified
# platform gateway (controller + EDA + hub under one CR).

apiVersion: v1
kind: Namespace
metadata:
  name: aap
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap-operator-group
  namespace: aap
spec:
  # Operator watches its own namespace (own-namespace install mode).
  targetNamespaces:
    - aap
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform-operator
  namespace: aap
spec:
  channel: stable-2.6
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
