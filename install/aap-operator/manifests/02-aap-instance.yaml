---
# 02-aap-instance.yaml
# The single AnsibleAutomationPlatform CR. The 2.7 operator deploys the gateway,
# controller, EDA, and hub from this one resource. Resource requests are tuned
# DOWN for a homelab SNO so all pods schedule cleanly on one 24-core / 64 GB node
# that also runs OpenShift's own control plane (and, when you want it, RHOAI).
#
# Notes:
#  - Requests (not limits) are what the scheduler uses to place pods. Keeping
#    requests modest lets everything fit; pods can still burst since we leave
#    most components without hard limits.
#  - file_storage_storage_class MUST be ReadWriteMany for hub. On SNO, set this
#    to your RWX class. If you only have RWO (common on bare-metal SNO with LVM),
#    either install the LVM/NFS RWX provisioner or disable hub (see below).
#  - EDA is explicitly enabled — it's the whole point of this lab.

apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: aap
spec:
  # --- Platform gateway (the unified UI / API front door) --------------------
  api:
    replicas: 1
    resource_requirements:
      requests:
        cpu: 100m
        memory: 256Mi

  redis:
    replicas: 1
    resource_requirements:
      requests:
        cpu: 100m
        memory: 256Mi

  database:
    resource_requirements:
      requests:
        cpu: 200m
        memory: 512Mi
    storage_requirements:
      requests:
        storage: 50Gi

  # --- Automation controller -------------------------------------------------
  controller:
    disabled: false
    uwsgi_processes: 2
    task_resource_requirements:
      requests:
        cpu: 250m
        memory: 512Mi
    web_resource_requirements:
      requests:
        cpu: 100m
        memory: 256Mi
    ee_resource_requirements:
      requests:
        cpu: 100m
        memory: 128Mi

  # --- Event-Driven Ansible --------------------------------------------------
  eda:
    disabled: false
    # A single worker is plenty for the compliance demo.
    api:
      resource_requirements:
        requests:
          cpu: 100m
          memory: 256Mi

  # --- Automation hub --------------------------------------------------------
  # Hub needs ReadWriteMany storage. If your SNO lacks an RWX class, set
  # `disabled: true` here and pull collections directly from Galaxy / a sync
  # instead — the compliance demo does not require a local hub.
  hub:
    disabled: false
    storage_type: file
    file_storage_storage_class: <read-write-many-storage-class>
    file_storage_size: 10Gi
    resource_requirements:
      requests:
        cpu: 100m
        memory: 256Mi
