# inventory/hosts.ini
#
# `linux_fleet` and `windows_fleet` roll up into `all`, which the playbook
# targets by default. The role auto-detects OS and runs the right path, so one
# `ansible-playbook` run can enforce the baseline across every platform at once
# — the slide-5 "one playbook set" claim, demonstrated.

[linux_fleet:children]
rhel
ubuntu
suse

[rhel]
# rhel9-demo ansible_host=192.0.2.11

[ubuntu]
# ubuntu-demo ansible_host=192.0.2.12

[suse]
# suse-demo ansible_host=192.0.2.13

# --- Windows targets ---------------------------------------------------------
# Reachable from the SNO over WinRM (5986/HTTPS) or OpenSSH on Server 2022+.
[windows_fleet]
# win2022-demo ansible_host=192.0.2.21

[windows_fleet:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_port=5986
ansible_winrm_server_cert_validation=ignore
# ansible_user / ansible_password supplied via an AAP machine credential,
# NOT stored here. For local testing use Vault, never plaintext.

# --- Local-only Linux demo target (uncomment to run against the control node) -
[linux_fleet]
localhost ansible_connection=local
