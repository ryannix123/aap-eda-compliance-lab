---
# enforce_sshd_baseline :: meta
galaxy_info:
  role_name: enforce_sshd_baseline
  namespace: redhat_demo
  author: Ryan Nix
  description: >-
    Enforce and continuously remediate an SSH hardening baseline across
    RHEL, Ubuntu, and SUSE. Designed to be driven on a schedule by AAP and
    event-driven by Ansible rulebooks (EDA).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9", "10"]
    - name: Ubuntu
      versions: ["focal", "jammy", "noble"]
    - name: opensuse
      versions: ["15"]
    - name: Windows
      versions: ["2019", "2022", "2025"]
  galaxy_tags:
    - security
    - compliance
    - ssh
    - hardening
    - cis

dependencies: []
